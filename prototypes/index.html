const hiEntries=Object.entries(hiUi).sort((a,b)=>b[0].length-a[0].length);
function localizedText(value){if(lang!=='hi')return String(value);const raw=String(value),trimmed=raw.trim();if(trimmed.endsWith(' visibility')&&hiUi[trimmed.slice(0,-11)])return raw.replace(trimmed,hiUi[trimmed.slice(0,-11)]+' की दृश्यता');if(hiUi[trimmed])return raw.replace(trimmed,hiUi[trimmed]);let m=trimmed.match(/^Profile (.+) mode set to (Public|Unlisted|Private)\.$/);if(m)return raw.replace(trimmed,'प्रोफ़ाइल '+m[1]+' का मोड '+hiUi[m[2]]+' किया गया।');m=trimmed.match(/^Profile (.+) changed (Public|Unlisted|Private) → (Public|Unlisted|Private); previous live link disabled immediately in mock\.$/);if(m)return raw.replace(trimmed,'प्रोफ़ाइल '+m[1]+' का मोड '+hiUi[m[2]]+' से '+hiUi[m[3]]+' हुआ; पिछला लाइव लिंक तुरंत बंद किया गया।');m=trimmed.match(/^(phone|whatsapp|email|address|map|city|name|headline|category|bio|website|social|services|serviceArea|hours) visibility set to (Private|Link-only|Public) on (.+)\.$/);if(m)return raw.replace(trimmed,'प्रोफ़ाइल '+m[3]+' में '+(hiUi[m[1]]||m[1])+' की दृश्यता '+hiUi[m[2]]+' की गई।');m=trimmed.match(/^Owner affirmatively confirmed (Public|Unlisted|Private) mode\.$/);if(m)return raw.replace(trimmed,'मालिक ने '+hiUi[m[1]]+' मोड की पुष्टि की।');m=trimmed.match(/^Link revoked for (.+); old link denied immediately in mock\.$/);if(m)return raw.replace(trimmed,m[1]+' का लिंक रद्द हुआ; पुराना लिंक तुरंत बंद किया गया।');m=trimmed.match(/^Link revoked for (.+); previous live link disabled immediately in mock\.$/);if(m)return raw.replace(trimmed,m[1]+' का लिंक रद्द हुआ; पिछला लाइव लिंक तुरंत बंद हुआ।');m=trimmed.match(/^Link regenerated for (.+); old link denied immediately in mock\.$/);if(m)return raw.replace(trimmed,m[1]+' के लिए नया लिंक बना; पुराना लिंक तुरंत बंद किया गया।');m=trimmed.match(/^Link regenerated for (.+); previous live link disabled immediately in mock\.$/);if(m)return raw.replace(trimmed,m[1]+' के लिए नया लिंक बना; पिछला लाइव लिंक तुरंत बंद हुआ।');m=trimmed.match(/^Profile (.+) deleted in mock; shared and saved live access disabled\.$/);if(m)return raw.replace(trimmed,m[1]+' की डेमो प्रोफ़ाइल हटाई गई; साझा और सेव लाइव पहुंच बंद हुई।');m=trimmed.match(/^Profile (.+) deleted in mock; previous live link disabled immediately in mock\.$/);if(m)return raw.replace(trimmed,m[1]+' की डेमो प्रोफ़ाइल हटाई गई; पिछला लाइव लिंक बंद हुआ।');m=trimmed.match(/^Moderator blocked\/unpublished sample listing; previous live link disabled immediately in mock\.$/);if(m)return raw.replace(trimmed,'मॉडरेटर ने नमूना सूची ब्लॉक/अप्रकाशित की; पिछला लाइव लिंक बंद हुआ।');m=trimmed.match(/^Profile (.+) saved to demo Smart Phonebook\.$/);if(m)return raw.replace(trimmed,m[1]+' डेमो स्मार्ट फोनबुक में सेव हुआ।');m=trimmed.match(/^Profile (.+) unsaved\.$/);if(m)return raw.replace(trimmed,m[1]+' को सेव सूची से हटाया गया।');m=trimmed.match(/^Private note\/tags updated for (.+)\.$/);if(m)return raw.replace(trimmed,m[1]+' के निजी नोट/टैग बदले गए।');m=trimmed.match(/^Fictional report submitted for (.+)\.$/);if(m)return raw.replace(trimmed,m[1]+' के लिए काल्पनिक रिपोर्ट जमा हुई।');m=trimmed.match(/^Simulated moderator permission (enabled|disabled)\.$/);if(m)return raw.replace(trimmed,'सिम्युलेटेड मॉडरेटर अनुमति '+(m[1]==='enabled'?'चालू':'बंद')+' हुई।');m=trimmed.match(/^Profile (.+) deleted in mock; shared and saved live access disabled\.$/);if(m)return raw.replace(trimmed,m[1]+' की डेमो प्रोफ़ाइल हटाई गई; साझा और सेव लाइव पहुंच बंद हुई।');let out=raw;for(const [en,hi] of hiEntries)if(en.length>=25&&out.includes(en))out=out.replaceAll(en,hi);return out}
function localizeMarkup(markup){if(lang!=='hi')return markup;return String(markup).replace(/>([^<>]+)</g,(whole,text)=>`>${localizedText(text)}<`).replace(/(placeholder|aria-label|title)="([^"]*)"/g,(whole,attr,value)=>`${attr}="${escape(localizedText(value))}"`)}
function profile(id=selected){return demoProfiles.find(p=>p.id===id)||demoProfiles[0]}function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}
function record(text){audit.unshift({time:new Date().toLocaleTimeString(lang==='hi'?'hi-IN':'en-US',{hour:'2-digit',minute:'2-digit'}),text});audit=audit.slice(0,30)}
function modeLabel(m){return m==='Public'?t('public'):m==='Unlisted'?t('unlisted'):t('private')}function audienceOptions(){return ['Private','Link-only','Public'].map(x=>`<option value="${x}">${x==='Private'?t('private'):x==='Link-only'?t('linkOnly'):t('public')}</option>`).join('')}
function areaOf(s){return Object.keys(areaScreens).find(a=>areaScreens[a].includes(s))||null}
function nav(){document.getElementById('mainNav').innerHTML=areas.map(a=>`<button class="nav-btn ${areaOf(current)===a?'active':''}" data-area="${escape(a)}"><span class="ico" aria-hidden="true">${icons[a]}</span><span>${t(a)}</span></button>`).join('')}
function header(title,subtitle,back=true){return `<div class="page-head"><div class="title-wrap">${back?`<button class="back" data-back aria-label="${t('back')}">← ${t('back')}</button>`:''}<div><div class="screen-kicker">TownTap${areaOf(current)?` · ${escape(t(areaOf(current)))}`:''}</div><h2>${t(title)}</h2><p>${subtitle}</p></div></div><span class="badge">${t('demoData')}</span></div>`}
function statePanel(kind,action=''){if(kind==='empty')return `<div class="state empty"><strong>${t('empty')}</strong><span>${t('noMatches')}</span>${action}</div>`;if(kind==='error')return `<div class="notice-red" role="alert">${t('error')}. <button class="link-btn small" data-retry>${t('go')}</button></div>`;if(kind==='offline')return `<div class="notice">${t('offline')}. <button class="link-btn small" data-retry>${t('go')}</button></div>`;return ''}
function fieldRows(p){return fieldDefs.map(([key,label])=>`<div class="switchline"><div><b>${escape(label)}</b><small>${key==='phone'||key==='whatsapp'||key==='email'||key==='address'||key==='map'?t('privateNote'):''}</small></div><select class="visibility" data-field="${key}" aria-label="${escape(label)} visibility">${audienceOptions().replace(`value="${p.fields[key]}"`,`value="${p.fields[key]}" selected`)}</select></div>`).join('')}
function welcome(){return `${header('Welcome','Create a digital card, keep a private phonebook, and discover local businesses.',false)}<div class="hero"><small>SMART PHONEBOOK · DIGITAL CARD · BUSINESS DIRECTORY</small><h3>${lang==='hi'?'एक कार्ड। सही संपर्क।':'One card. The right connection.'}</h3><p>${lang==='hi'?'अपना परिचय साझा करें और संपर्क संदर्भ निजी रखें।':'Share your identity and keep personal contact context private.'}</p><button class="primary" data-action="signin">${t('signin')}</button> <button class="secondary" data-action="browse">${t('browse')}</button></div><div class="grid three"><div class="card"><h3>① ${t('My Cards')}</h3><p>Create and share a digital card. Sensitive fields start private.</p></div><div class="card"><h3>② ${t('Saved')}</h3><p>Save live cards with notes and tags visible only to you.</p></div><div class="card"><h3>③ ${t('Discover')}</h3><p>Explore fictional Gohana/Sonipat-prioritized demo businesses.</p></div></div><p class="footer-note">Sign in is simulated; no OTP is sent and no account is created.</p>`}
function home(){return `${header('Home','Quick actions, recent saves and search entry.',false)}<div class="hero"><small>YOUR DIGITAL IDENTITY</small><h3>${lang==='hi'?'आपका नेटवर्क, सरल।':'Your network, simplified.'}</h3><p>TownTap combines digital cards, a private Smart Phonebook and local discovery.</p><button class="primary" data-screen="My Cards">${t('My Cards')}</button></div><div class="field"><label for="globalSearch">${t('search')}</label><input id="globalSearch" class="search" placeholder="${t('searchPrompt')}"></div><div class="tiles"><button class="tile" data-screen="My Cards"><span class="tile-icon">▣</span><strong>${t('My Cards')}</strong><small>Create, edit and share cards</small></button><button class="tile" data-screen="Saved Contacts"><span class="tile-icon">♧</span><strong>${t('Saved')}</strong><small>Private saved references</small></button><button class="tile" data-screen="Discover"><span class="tile-icon">⌖</span><strong>${t('Discover')}</strong><small>Gohana / Sonipat priority</small></button><button class="tile" data-screen="Settings"><span class="tile-icon">☷</span><strong>${t('Profile')}</strong><small>Privacy, language and demo controls</small></button></div><h3 class="section-title">Recent saves</h3>${saved.length?saved.slice(0,3).map(s=>personRow(profile(s.profileId),s)).join(''):statePanel('empty',`<button class="primary small" data-screen="Discover">${t('Discover')}</button>`)}`}
function personRow(p,s){const live=livePermitted(p,'Public');return `<button class="person" data-open-saved="${p.id}"><div class="avatar">${escape((p.name||'?').slice(0,1))}</div><div class="grow"><strong>${escape(live.name||'Unavailable profile')}</strong><small>${escape(live.headline||'')}${live.city?' · '+escape(live.city):''}</small><small>🔒 ${escape(s?.note||'')}</small></div><span class="badge ${p.deleted||p.mode==='Private'?'private':'public'}">${p.deleted||p.mode==='Private'?t('private'):modeLabel(p.mode)}</span></button>`}
function cardList(){const rows=demoProfiles.filter(p=>!p.deleted).map(p=>`<div class="card row between"><div class="row"><div class="avatar">${escape(p.name[0])}</div><div><h3>${escape(p.name)}</h3><p>${escape(p.headline)} · ${escape(p.city)}</p><span class="badge ${p.mode.toLowerCase()}">${modeLabel(p.mode)}</span></div></div><div class="actions"><button class="secondary small" data-edit="${p.id}">${t('Card Editor')}</button><button class="secondary small" data-view="${p.id}">${t('Public Card')}</button></div></div>`).join('');return `${header('My Cards','Card gallery, visibility status, preview and sharing.')}<div class="toolbar"><button class="primary" data-action="new-card">＋ ${t('Card Editor')}</button><button class="secondary" data-screen="Business Studio">${t('Business Studio')}</button></div><div class="stack">${rows}</div><h3 class="section-title">Share a profile</h3>${qr(profile())}<div class="actions"><button class="secondary" data-action="open-mock-link">Open valid mock link</button><button class="secondary" data-action="open-old-link">Test previous link after revoke</button></div>`}
function editor(){const p=profile();return `${header('Card Editor','Edit a fictional profile. All sensitive fields start Private.')}${formError?`<div class="notice-red" role="alert">${t('validation')}</div>`:''}<div class="notice-inline">${t('privateDisclosure')} This is a local simulation; controls do not secure data.</div><div class="field"><label for="f-name">Display name *</label><input id="f-name" value="${escape(p.name)}" maxlength="80"><span class="field-error" id="e-name">${formError?'Name is required.':''}</span></div><div class="form-grid">${[['headline','Headline'],['category','Category'],['city','City']].map(([k,l])=>`<div class="field"><label for="f-${k}">${l}</label><input id="f-${k}" value="${escape(p[k])}" maxlength="100"></div>`).join('')}</div><div class="field"><label for="f-bio">Short bio / description</label><textarea id="f-bio" maxlength="400">${escape(p.bio)}</textarea></div><h3 class="section-title">Field-level visibility</h3><p class="muted">Choose Private, Link-only or Public for each field. Sensitive fields are initialized Private.</p><div id="fieldRows">${fieldRows(p)}</div><h3 class="section-title">Profile visibility</h3><div class="field"><label for="profileMode">Mode</label><select id="profileMode"><option ${p.mode==='Private'?'selected':''}>Private</option><option ${p.mode==='Unlisted'?'selected':''}>Unlisted</option><option ${p.mode==='Public'?'selected':''}>Public</option></select><span class="help">${p.mode==='Public'?t('publicDisclosure'):p.mode==='Unlisted'?t('linkDisclosure'):t('privateDisclosure')}</span></div><div class="actions"><button class="primary" data-action="save-profile">${t('save')}</button><button class="secondary" data-action="force-error">Show validation error</button><button class="secondary" data-action="offline">Toggle offline state</button></div>`}
function livePermitted(p,audience,tokenValid=true){if(p.deleted||p.blocked)return {};if(p.mode==='Private')return {};if(p.mode==='Unlisted'&&(!tokenValid||audience!=='Link'))return {};const out={};for(const [key] of fieldDefs){const level=p.fields[key]||'Private';if(audience==='Owner'||level==='Public'||(audience==='Link'&&level==='Link-only'))out[key]=p[key]}return out}
function shareUrlFor(p){return `https://demo.towntap.invalid/p/${encodeURIComponent(p.id)}?key=${p.token}`}
function qr(p){const url=shareUrlFor(p);return `<div class="split"><div><div class="qr-wrap"><canvas id="qrCanvas" width="232" height="232" aria-label="Generated demo QR code"></canvas></div><p class="muted">Scans to a reserved .invalid demo URL; it is not hosted.</p></div><div><h3>${t('mockUrl')}</h3><input class="search" readonly value="${escape(url)}" id="shareUrl"><div class="actions"><button class="primary" data-action="copy-link">${t('copy')}</button><button class="secondary" data-action="native-share">${t('share')}</button></div><div class="actions"><button class="danger small" data-action="revoke">${t('revoke')}</button><button class="secondary small" data-action="regenerate">${t('regenerate')}</button></div><p class="muted">Revocation immediately disables this mock token for new simulated reads. Copied information cannot be recalled.</p></div></div>`}

// Minimal standards-based QR Model 2 encoder: version 3-L, byte mode, one block.
function gfMul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11d);if((y>>>i)&1)z^=x}return z}
function rsDivisor(degree){let result=Array(degree).fill(0);result[degree-1]=1;let root=1;for(let i=0;i<degree;i++){for(let j=0;j<degree;j++){result[j]=gfMul(result[j],root);if(j+1<degree)result[j]^=result[j+1]}root=gfMul(root,2)}return result}
function rsRemainder(data,div){let res=Array(div.length).fill(0);for(const b of data){const factor=b^res.shift();res.push(0);for(let i=0;i<res.length;i++)res[i]^=gfMul(div[i],factor)}return res}
function qrMatrix(text){
 const bytes=[...new TextEncoder().encode(text)];if(bytes.length>53)throw Error('Mock URL exceeds QR v3-L capacity');
 const bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));put(0,4);while(bits.length%8)bits.push(0);
 const data=[];for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((a,b)=>(a<<1)|b,0));for(let pad=0;data.length<55;pad++)data.push(pad%2?0x11:0xec);
 const all=data.concat(rsRemainder(data,rsDivisor(15))),n=29,m=Array.from({length:n},()=>Array(n).fill(null));
 function finder(x,y){for(let dy=-1;dy<=7;dy++)for(let dx=-1;dx<=7;dx++){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=n||yy>=n)continue;m[yy][xx]=(dx>=0&&dx<=6&&dy>=0&&dy<=6&&(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)))?1:0}}
 finder(0,0);finder(n-7,0);finder(0,n-7);
 // Version 3 has a single alignment pattern at (22,22); the other centers overlap finder patterns.
 for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)m[22+dy][22+dx]=Math.max(Math.abs(dx),Math.abs(dy))!==1?1:0
 for(let i=8;i<n-8;i++){if(m[6][i]===null)m[6][i]=i%2===0?1:0;if(m[i][6]===null)m[i][6]=i%2===0?1:0}
 // Reserve both format-information copies before placing data bits.
 for(let i=0;i<=5;i++)m[i][8]=0;m[7][8]=0;m[8][8]=0;m[8][7]=0;for(let i=9;i<15;i++)m[8][14-i]=0;
 for(let i=0;i<8;i++)m[8][n-1-i]=0;for(let i=8;i<15;i++)m[n-15+i][8]=0;m[n-8][8]=1;
 let idx=0,up=true;for(let right=n-1;right>=1;right-=2){if(right===6)right--;for(let vert=0;vert<n;vert++){const y=up?n-1-vert:vert;for(let j=0;j<2;j++){const x=right-j;if(m[y][x]===null){const bit=idx<all.length*8?((all[idx>>>3]>>>(7-(idx&7)))&1):0;m[y][x]=bit^((x+y)%2===0?1:0);idx++}}}up=!up}
 let format=1<<3,rem=format;for(let i=0;i<10;i++)rem=(rem<<1)^(((rem>>>9)&1)*0x537);const f=((format<<10)|rem)^0x5412;
 for(let i=0;i<=5;i++)m[i][8]=(f>>>i)&1;m[7][8]=(f>>>6)&1;m[8][8]=(f>>>7)&1;m[8][7]=(f>>>8)&1;for(let i=9;i<15;i++)m[8][14-i]=(f>>>i)&1;
 for(let i=0;i<8;i++)m[8][n-1-i]=(f>>>i)&1;for(let i=8;i<15;i++)m[n-15+i][8]=(f>>>i)&1;m[n-8][8]=1;return m
}
function drawQr(p){const canvas=document.getElementById('qrCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');try{const m=qrMatrix(shareUrlFor(p));const q=4,size=m.length+q*2,scale=canvas.width/size;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#17253b';for(let y=0;y<m.length;y++)for(let x=0;x<m.length;x++)if(m[y][x])ctx.fillRect(Math.floor((x+q)*scale),Math.floor((y+q)*scale),Math.ceil(scale),Math.ceil(scale))}catch{ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#b33943';ctx.fillText(lang==='hi'?'QR उपलब्ध नहीं':'QR unavailable',20,30)}}
render();
})();
